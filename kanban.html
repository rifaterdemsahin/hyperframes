<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Kanban</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#17202a;--mute:#5b6675;--line:#dde3ea;--accent:#0a7c91;--you:#b7791f;--ai:#0a7c91;--ok:#2f855a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8ecf1;--mute:#8b95a5;--line:#232a35;--accent:#4cc3d9;--you:#ffd166;--ai:#4cc3d9;--ok:#68d391}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{max-width:1400px;margin:auto;padding:24px 16px 8px}h1{margin:0;font-size:26px}header p{margin:4px 0 12px;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:hover{border-color:var(--accent)}
.board{max-width:1400px;margin:auto;padding:8px 16px 48px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start}
.col{background:color-mix(in srgb,var(--card) 60%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px}
.col h2{margin:2px 4px 10px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0 0 8px;color:var(--mute);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor;margin-right:6px}
.chip.you{color:var(--you)}.chip.ai{color:var(--ai)}.chip.done{color:var(--ok)}
label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
textarea,select{width:100%;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
textarea{min-height:60px;resize:vertical}
</style>
</head>
<body data-feedback="custom">
<script src="nav.js?v=1.33.0"></script>
<header>
  <h1>Video Kanban: Liquidation Part 1</h1>
  <p>Cards tagged <span class="chip you">YOU</span> need something from you. Type instructions in each box. They save in this browser only, so use <b>Copy for Claude</b> and paste the result into the chat.</p>
  <div class="bar">
    <button class="primary" id="copy">Copy for Claude</button>
    <button id="dl">Download JSON</button>
    <button id="reset">Reset instructions</button>
  </div>
</header>
<div class="board" id="board"></div>
<div id="bar2" style="position:sticky;bottom:0;z-index:900;padding:10px 16px;background:var(--card);border-top:1px solid var(--line)"><button class="primary" onclick="document.getElementById('copy').click()">Copy for Claude</button> <small style="color:var(--mute)">Same as the top button, copies every instruction you typed.</small></div>
<script>
const COLS=[["input","Needs your input"],["ready","Ready for Claude"],["doing","In progress"],["done","Done"]];
const TASKS=[
 // Needs your input
 {id:"t01",col:"input",who:"you",title:"Review draft v2 and approve it, or send more notes",desc:"Draft v2 is rendered and waiting for your verdict."},
 {id:"t02",col:"input",who:"you",title:"HMRC screen for step 1 (S2), optional",desc:"The hook no longer shows figures, so this is only an optional inset for step 1. Blur the UTR and login and hide the balance."},
 {id:"t03",col:"input",who:"you",title:"Face-cam clip for the intro",desc:"About 15 s, Part 1 intro. Say if the face-cam audio is the voiceover or if you record it separately."},
 {id:"t04",col:"input",who:"you",title:"Voiceover: keep the AI draft or record your own",desc:"A British male AI draft plays on each storyboard panel, regenerated for the rewritten script. No scene overruns now. Keep it, change the voice, or send your own recording."},
 {id:"t05",col:"input",who:"you",title:"n8n canvas recording (S3) and dashboard (S10)",desc:"20 s canvas capture, then the dashboard. Any client data blurred."},
 {id:"t06",col:"input",who:"you",title:"Email screenshots (S12), blurred",desc:"Chase reminders, the receipt, the liquidation-date email. Names and addresses blurred. I will add a Gmail and Drive over MCP diagram."},
 {id:"t07",col:"done",who:"you",title:"Confirm the facts on screen",desc:"£1,500 + £2,100, about two months, 4.8 Trustpilot. Verified as average UK figures."},
 {id:"t08",col:"input",who:"you",title:"Look and sound: palette, font, music",desc:"Any brand colours, a font, a music preference, or say 'your call'."},
 {id:"t22",col:"done",who:"you",title:"Skool community name and link",desc:"Integrated into Scene 10 outro panel with end zoom focus."},
 {id:"t23",col:"input",who:"you",title:"Ask the practitioner about emailing the parties",desc:"The script says AI agents email the right parties. Check what you may send yourself before Part 2 shows it."},
 {id:"t27",col:"input",who:"you",title:"Part 2 link (after it is published)",desc:"Goes in the description and on the end screen."},
 {id:"t32",col:"done",who:"you",title:"Official n8n logo file",desc:"Scene 8 has the official n8n brand logo asset."},
 {id:"t33",col:"done",who:"you",title:"Confirm the £1,500 + £2,100 are average UK figures",desc:"Draft v2 through v9 state these are average figures in the UK."},
 {id:"t35",col:"input",who:"you",title:"Keep the repo public until release?",desc:"The repo and site are public and earlier commits still contain the debt figure. Keep it, make the repo private, or ask me to rewrite the history."},
 {id:"t36",col:"input",who:"you",title:"Face on the thumbnail?",desc:"Thumbnail A has room for a photo of you. Send a clear photo, or say no."},
 {id:"t37",col:"input",who:"you",title:"DeepSeek button: how to continue",desc:"The system blocked storing your DeepInfra key as a GitHub secret. Set it yourself with gh secret set DEEPINFRA_API_KEY, or tell me another way."},
 {id:"t38",col:"input",who:"you",title:"The comment you left in the Studio app",desc:"It is not in the project files or history. Paste the text here."},
 {id:"t39",col:"input",who:"you",title:"Practitioner reads the script and the description",desc:"They make the same factual claims about liability and process. Ask your insolvency practitioner to read both."},
 {id:"t09",col:"input",who:"you",title:"Rotate the fal.ai key",desc:"The key was pasted in chat. Create a new one and replace FAL_KEY in your local .env."},
 // Ready for Claude
 {id:"t10",col:"done",who:"ai",title:"Built the 10 scenes in Hyperframes",desc:"One file per scene, generated from scenes.json."},
 {id:"t11",col:"done",who:"ai",title:"Motion graphics",desc:"Goal infographic, cost and timeline graphic, four exception cards, email timeline, subscribe animation."},
 {id:"t12",col:"done",who:"ai",title:"Captions in the draft",desc:"Timed by sentence from the AI voice. Final captions come from your own recording."},
 {id:"t13",col:"done",who:"ai",title:"Checked, snapshotted and fixed",desc:"Hyperframes check passes with 0 errors and 0 warnings."},
 {id:"t14",col:"done",who:"ai",title:"Swap in real footage and render MP4",desc:"Rendered full 1080p looks master and 720p HD web copies."},
 {id:"t15",col:"done",who:"ai",title:"Part 2 teaser end screen",desc:"End card and teaser for Part 2 with comment call to action."},
 // Done
 {id:"t16",col:"done",who:"ai",title:"Scaffold Hyperframes project, design doc, scene data",desc:"Stage 1."},
 {id:"t17",col:"done",who:"ai",title:"Storyboard with fal.ai backgrounds",desc:"Stage 2."},
 {id:"t19",col:"done",who:"ai",title:"Draft voiceover for all 10 scenes",desc:"fal.ai Kokoro, placed on the storyboard."},
 {id:"t20",col:"done",who:"ai",title:"Rewrite script from your feedback (v1.1.0)",desc:"New wording, voiceover and timings. Check the storyboard and send more feedback."},
 {id:"t21",col:"done",who:"ai",title:"Versioning and copy-feedback on every page",desc:"Footer versions, changelog, and a feedback bar like the storyboard."},
 {id:"t24",col:"done",who:"ai",title:"Script rewritten around AI and red tape (v1.4.0)",desc:"From your Script page feedback: new wording and voiceover, re-timed."},
 {id:"t25",col:"done",who:"ai",title:"AGENTS.md, agents page and Reuse page (v1.4.0)",desc:"Postprod menu: master spec, release checklist, AGENTS.md, reuse guide."},
 {id:"t28",col:"done",who:"ai",title:"Architecture diagram on the hub (v1.5.0)",desc:"Icons, dependency arrows and a dependency table."},
 {id:"t29",col:"done",who:"ai",title:"Title, description and thumbnails drafted (v1.5.0)",desc:"Publish page under Postprod, with two real 1280x720 thumbnails."},
 {id:"t30",col:"done",who:"ai",title:"Title and thumbnail chosen (v1.5.3)",desc:"You picked the title \"Stuck in Red Tape? How I Use AI When a Process Gets Confusing\" and thumbnail A. Marked on the Publish page."},
 {id:"t31",col:"done",who:"ai",title:"First draft built, rendered and embedded (v1.6.0)",desc:"3:38 with the AI voice and captions, 0 check warnings. Postprod: First draft, Review, Performance pages."},
 {id:"t34",col:"done",who:"ai",title:"Draft v2 from your review notes (v1.8.0)",desc:"8 notes applied: AI-age hook, connect parts to AI, learn the details, average UK figures, lever animation, stakes line, bigger footage frame, n8n logo slot, next journey."},
 {id:"t18",col:"done",who:"ai",title:"GitHub Pages hub, this kanban",desc:"index.html and kanban.html."},
 {id:"t40",col:"done",who:"ai",title:"Draft v3: Serious British tone & BAM impact (v1.10.0)",desc:"Regenerated 10 audio clips (bm_lewis), YOU+AI leverage graphic, 2-month timeline, MCP pipeline."},
 {id:"t41",col:"done",who:"ai",title:"Draft v4: Kinetic animated subtitles & Skool logo (v1.11.0)",desc:"Kinetic phrase illumination with cadence tracker; official Skool brand logo integrated."},
 {id:"t42",col:"done",who:"ai",title:"Draft v5: 1.1x Charismatic voice & IT contractor context (v1.13.0)",desc:"Accelerated to 1.1x (bm_george), IT contractor IR35 context, Shame to Grace guidance."},
 {id:"t43",col:"done",who:"ai",title:"Draft v6: Core Strategy reactor & ChatGPT co-pilot (v1.14.0)",desc:"Rotating AI core reactor in Scene 01, ChatGPT live co-pilot in Scene 04, Bot-to-Human handover in Scene 10."},
 {id:"t44",col:"done",who:"ai",title:"Draft v7: Clean metadata & Hero's Journey backdrop (v1.16.0)",desc:"Removed scene label tags, added emojis across overlays, Hero's Journey mountain backdrop, Azure drawing upload."},
 {id:"t45",col:"done",who:"ai",title:"Draft v8: Removed 'DRAFT V*' watermark across entire video (v1.19.0)",desc:"Clean master presentation; master spec learnings updated; 1080p master published to GitHub Releases."},
 {id:"t46",col:"done",who:"ai",title:"Draft v9: Removed BAM sfx & Scene 07 balance rule (v1.20.0)",desc:"Removed BAM sound effect; corrected rule: process starts once balance is paid; distinct friend question voice tone; Skool outro focus."},
 {id:"t47",col:"done",who:"ai",title:"Costs: Flat $20/mo subscriptions amortization ($3.08/video) (v1.20.1)",desc:"Recalculated costs on costs.html for Claude Pro + Gemini Antigravity plans @ 3 videos/week ($0.00 marginal cost)."},
 {id:"t48",col:"done",who:"ai",title:"Releases: 2 GB master video delivery via GitHub Releases (v1.17.0)",desc:"Automated pipeline (publish-release.mjs) to upload full 1080p master MP4s directly to GitHub Releases."}
];
const KEY="liquidation-kanban-v1";
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
// Instructions written before the last "feedback implemented" release are deleted (column moves are kept).
const cleared=(window.SITE_INFO&&window.SITE_INFO.clearedAt)||"";
const ts=saved.__ts=saved.__ts||{};
Object.keys(saved).forEach(id=>{if(id==="__ts")return;const x=saved[id];if(x&&x.note&&cleared&&ts[id]&&ts[id]<cleared){x.note="";delete ts[id]}});
save();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state=t=>Object.assign({col:t.col,note:""},saved[t.id]||{});
function render(){
  document.getElementById("board").innerHTML=COLS.map(([c,name])=>{
    const cards=TASKS.filter(t=>state(t).col===c);
    return `<section class="col"><h2><span>${name}</span><span>${cards.length}</span></h2>${cards.map(t=>{
      const s=state(t);
      return `<div class="card"><h3><span class="chip ${s.col==="done"?"done":t.who}">${s.col==="done"?"DONE":t.who==="you"?"YOU":"CLAUDE"}</span>${esc(t.title)}</h3><p>${esc(t.desc)}</p>
      <label for="n-${t.id}">Your instructions</label><textarea id="n-${t.id}" data-id="${t.id}" placeholder="Type here...">${esc(s.note)}</textarea>
      <label for="c-${t.id}">Column</label><select id="c-${t.id}" data-id="${t.id}">${COLS.map(([k,n])=>`<option value="${k}"${k===s.col?" selected":""}>${n}</option>`).join("")}</select></div>`}).join("")}</section>`}).join("");
}
document.getElementById("board").addEventListener("input",e=>{
  const id=e.target.dataset.id;if(!id)return;
  const t=TASKS.find(x=>x.id===id),s=state(t);
  if(e.target.tagName==="TEXTAREA"){s.note=e.target.value;ts[id]=new Date().toISOString()}
  else{s.col=e.target.value;saved[id]=s;save();render();return}
  saved[id]=s;save();
});
const exportData=()=>TASKS.map(t=>{const s=state(t);return{id:t.id,title:t.title,owner:t.who,column:s.col,instructions:s.note}});
document.getElementById("copy").onclick=async e=>{
  const md=exportData().filter(t=>t.instructions.trim()||t.column!==TASKS.find(x=>x.id===t.id).col)
    .map(t=>`- [${t.id}] ${t.title} (${t.column}): ${t.instructions||"(moved only)"}`).join("\n")||"(no instructions entered)";
  try{await navigator.clipboard.writeText("Kanban instructions:\n"+md);e.target.textContent="Copied"}catch(err){e.target.textContent="Copy failed: use Download"}
  setTimeout(()=>e.target.textContent="Copy for Claude",1800);
};
document.getElementById("dl").onclick=()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(exportData(),null,2)],{type:"application/json"}));a.download="kanban-instructions.json";a.click();
};
document.getElementById("reset").onclick=()=>{if(confirm("Clear all instructions and column moves?")){saved={};save();render()}};
render();
</script>
</body>
</html>
